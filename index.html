<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Biodata Mahasiswa</title>
</head>
<body>

    <header>
        <table width="700" align="center">
            <tr>
                <td width="120">
                    <figure>
                        <img src="logo.png" alt="Logo Unindra" width="120">
                    </figure>
                </td>
                <td align="center">
                    <h2><b> UNIVERSITAS INDRAPRASTA PGRI<br>(UNINDRA)</b></h2>
                    <h2><i>Jl. Nangka No.58 Tanjung Barat - Jaksel</i></h2>
                </td>
            </tr>
        </table>
        <hr width="800" color="navy" size="6">
        <h4 align="center">BIODATA MAHASISWA</h4>
    </header>

    <section>
        <form>
            <table align="center" border="0" width="500" cellspacing="5">
                <tr>
                    <td width="150"><label for="nama">NAMA:</label></td>
                    <td>:</td>
                    <td><input type="text" id="nama" name="nama" size="25"></td>
                </tr>

                <tr>
                    <td><label for="alamat">ALAMAT</label></td>
                    <td>:</td>
                    <td><textarea id="alamat" name="alamat" rows="5" cols="40"></textarea></td>
                </tr>

                <tr>
                    <td><label for="tgl_lahir">TANGGAL LAHIR</label></td>
                    <td>:</td>
                    <td><input type="date" id="tgl_lahir" name="tgl_lahir"></td>
                </tr>

                <tr>
                    <td><label for="telp">TELP</label></td>
                    <td>:</td>
                    <td><input type="text" id="telp" name="telp" size="25"></td>
                </tr>

                <tr>
                    <td><label for="email">EMAIL</label></td>
                    <td>:</td>
                    <td><input type="text" id="email" name="email" size="25"></td>
                </tr>

                <tr>
                    <td></td>
                    <td></td>
                    <td>
                        <input type="submit" value="SIMPAN">
                        <input type="reset" value="BATAL">
                    </td>
                </tr>
            </table>
        </form>
    </section>

</body>
</html>
